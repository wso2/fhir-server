# FHIR Server — example configuration
#
# All keys are optional. Anything omitted falls back to the matching
# environment variable, and then to the built-in default.
#
# Precedence (highest wins): env var > this file > default.
# Point the server at this file with:
#     fhir-server --config /path/to/config.yaml
#   or
#     FHIR_SERVER_CONFIG=/path/to/config.yaml fhir-server

server:
  port: 9090
  baseUrl: http://localhost:9090/fhir/r4
  # HTTP server timeouts — Go duration strings; "0s" disables one entirely.
  # Env equivalents: SERVER_READ_TIMEOUT / SERVER_WRITE_TIMEOUT / SERVER_IDLE_TIMEOUT.
  # NOTE: writeTimeout bounds the WHOLE handler execution — raise it if you ingest
  # large transaction bundles, or slow-but-legitimate requests get cut off after
  # they already committed.
  # readTimeout: 30s
  # writeTimeout: 60s
  # idleTimeout: 120s

logging:
  # One of: debug, info, warn, error
  level: info

database:
  # Either supply a full DSN ...
  url: postgres://fhir:fhir@localhost:5432/fhirdb?sslmode=disable&pool_max_conns=20
  # ... or the individual components (ignored when `url` is set):
  # host: localhost
  # port: "5432"
  # user: fhir
  # password: fhir
  # name: fhirdb
  # Create the server's tables on startup. Off by default because it needs a
  # DB role with DDL privileges — the runtime role usually should not have
  # those. Enable it for a one-off first start, or create tables out-of-band
  # with a privileged role. Env equivalent: FHIR_CREATE_TABLES=true.
  # createTables: false

  # Per-connection plan_cache_mode. force_custom_plan is required for the search
  # probe architecture's per-bound plan choice — change only for experiments;
  # auto / force_generic_plan re-expose the misestimate pathologies the probe
  # exists to avoid. One of: force_custom_plan, auto, force_generic_plan.
  # Env: DATABASE_PLAN_CACHE_MODE.
  # planCacheMode: force_custom_plan

search:
  # Density-probe cap for half-bounded quantity/date/number searches.
  # Probe < cap → sp-first seek (cost bounded by cap rows); probe hits cap →
  # recency walk (cost bounded by pageSize × partitionRows / cap entries).
  # Near-optimal at sqrt(pageSize × partitionRows): 5000 suits ~500k-row sp
  # partitions; re-derive when the dataset grows 10x. Range 100–1000000.
  # Env: SEARCH_PROBE_CAP.
  # probeCap: 5000

  # Page size when the request omits _count. Range 1–1000.
  # Env: SEARCH_DEFAULT_PAGE_SIZE.
  # defaultPageSize: 20

  # Upper clamp on client-supplied _count. 0 = unlimited (legacy behavior).
  # Recommended 200 in production. Range 0 or 1–10000. Env: SEARCH_MAX_PAGE_SIZE.
  # maxPageSize: 0

  # Chained-parameter recursion bound. Range 1–10. Env: SEARCH_MAX_CHAIN_DEPTH.
  # maxChainDepth: 5

write:
  # Rows per multi-row INSERT in the bundle writer. Kept small so each statement's
  # parse tree stays modest; additionally clamped by the 65535-parameter protocol
  # limit at write time. Range 100–20000. Env: WRITE_MAX_ROWS_PER_STATEMENT.
  # maxRowsPerStatement: 1000

  # Maximum index rows a single write transaction (bundle or resource) may buffer.
  # A write that would exceed this is rejected with HTTP 413 and rolled back, so a
  # pathological bundle fails the request instead of exhausting database memory.
  # Raise for trusted bulk-import environments. Range 1000–100000000.
  # Env: WRITE_MAX_ROWS_PER_BUNDLE.
  # maxRowsPerBundle: 100000

bundle:
  # Shard count for parallel transaction bundle execution
  # (x-bundle-processing-logic: parallel, Microsoft-compatible). 1 keeps the
  # capability off; >1 lets a transaction bundle's writes run across that many
  # concurrent database transactions. Requires the client contract documented in
  # docs/performance-tuning.md §5 (no overlapping write targets; relaxed commit
  # semantics). Size the pool: expected_concurrent_bundles * transactionConcurrency
  # <= pool max_conns. Range 1–64. Env: BUNDLE_TRANSACTION_CONCURRENCY.
  # transactionConcurrency: 1

  # Mode when a request carries no x-bundle-processing-logic header:
  # "sequential" (default) or "parallel". Set "parallel" to opt whole workloads
  # in without per-request headers (e.g. import harnesses that don't send the
  # header). Env: BUNDLE_TRANSACTION_PROCESSING_DEFAULT.
  # transactionProcessingDefault: sequential

ig:
  # Implementation guides to load at startup. None are loaded by default —
  # the server runs as a plain base FHIR R4 store until you opt in here.
  # Loading an IG fetches its package from registryUrl on first boot and
  # enables that guide's search parameters and profile validation.
  # Uncomment to load, e.g. US Core:
  packages: []
    # - hl7.fhir.us.core@6.1.0
    # - hl7.fhir.us.carin-bb@2.0.0
  registryUrl: https://packages.fhir.org
  forceReload: false
  cacheDir: .fhir-ig-cache
