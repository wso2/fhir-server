services:
  db:
    image: postgres:18-alpine
    # Preload pg_stat_statements so the query-profiling view collects data; the
    # extension itself is created by schema.sql (plan-selection standard §2).
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
    environment:
      POSTGRES_DB: fhirdb
      POSTGRES_USER: fhir
      POSTGRES_PASSWORD: fhir
    ports:
      - "5432:5432"
    volumes:
      # Mount the whole /var/lib/postgresql, not .../data: from 18 the images keep
      # data in a major-version-specific subdirectory (PGDATA=/var/lib/postgresql/18/docker)
      # and refuse to start if .../data is a mount point. A single mount here also
      # keeps `pg_upgrade --link` inside one mount boundary for future major bumps.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fhir -d fhirdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Lightweight web UI for browsing the database. Open http://localhost:8080
  # and log in with System: PostgreSQL, Server: db, User: fhir, Password: fhir,
  # Database: fhirdb.
  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    environment:
      DATABASE_URL: postgres://fhir:fhir@db:5432/fhirdb?sslmode=disable&pool_max_conns=20
      # The bundled `fhir` user owns fhirdb and has DDL rights, so let the
      # server create its tables on first start. In production, create tables
      # out-of-band with a privileged role and leave this unset (default off).
      FHIR_CREATE_TABLES: "true"
      SERVER_PORT: "9090"
      BASE_URL: http://localhost:9090/fhir/r4
      LOG_LEVEL: info
      # IG_PACKAGES: hl7.fhir.us.core@6.1.0,hl7.fhir.us.carin-bb@2.0.0
      IG_CACHE_DIR: /data/fhir-ig-cache
    volumes:
      - igcache:/data/fhir-ig-cache
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    # Health is exposed at GET /health/ready. The container image is distroless and
    # has no shell or wget, so probe externally (e.g. k8s readinessProbe httpGet)
    # or from the host with: curl -fsS http://localhost:9090/health/ready

volumes:
  pgdata:
  igcache:
