# Values used by `helm lint` / `helm template` in CI. Exercises the
# existingSecret database path plus every optional resource, so CI renders
# (and thus type-checks) the full template surface, not just the defaults.

database:
  existingSecret:
    name: fhir-server-db-credentials
    key: database-url

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: fhir.example.com
      paths:
        - path: /
          pathType: Prefix

autoscaling:
  enabled: true

podDisruptionBudget:
  enabled: true

networkPolicy:
  enabled: true
  extraEgress:
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - port: 5432
          protocol: TCP

persistence:
  igCache:
    enabled: true
    # ReadWriteMany: this file also enables autoscaling (maxReplicas > 1), and
    # every replica mounts this same PVC -- ReadWriteOnce would fail the chart's
    # own guard (see templates/pvc.yaml) since it only attaches to one node.
    accessMode: ReadWriteMany
