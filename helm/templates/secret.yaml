{{/*
Dev/quickstart path only: renders a Secret from database.url. Anything beyond
local use should set database.existingSecret instead, so the DSN never lands in
values.yaml or Helm release history.
*/}}
{{- if and .Values.database.url (not .Values.database.existingSecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fhir-server.fullname" . }}
  labels:
    {{- include "fhir-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.database.url | quote }}
{{- end }}
